{% extends 'base.html' %}{% block content %}<h2>Ticket check-in</h2><p>Select the event, then scan with a keyboard-type QR reader or paste the ticket text.</p>{% if result %}<p class="notice" role="status"><strong>{{ 'Accepted' if accepted else 'Rejected' }}:</strong> {{ result }}</p>{% endif %}<form method="post"><input type="hidden" name="csrf" value="{{ session.csrf }}"><label>Event<select name="event_id" required>{% for event in events %}<option value="{{ event.id }}" {% if request.form.get('event_id') == event.id|string %}selected{% endif %}>{{ event.name }} ({{ event.event_date }})</option>{% endfor %}</select></label><label>Scanned ticket text<textarea name="token" rows="4" required maxlength="200">{{ request.form.get('token','') }}</textarea></label><button>Validate ticket</button></form>{% endblock %}
