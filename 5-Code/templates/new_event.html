{% extends 'base.html' %}{% block content %}<h2>Event proposal</h2><form method="post"><input type="hidden" name="csrf" value="{{ session.csrf }}"><label>Event name<input name="name" maxlength="120" required value="{{ values.get('name','') }}"></label><label>Date<input type="date" name="event_date" required value="{{ values.get('event_date','') }}"></label><label>Venue<input name="venue" maxlength="120" required value="{{ values.get('venue','') }}"></label><label>Expected attendees<input type="number" name="capacity" min="1" max="10000" required value="{{ values.get('capacity','') }}"></label><label>Budget items (one per line, description | amount in rupees)<textarea name="budget_items" rows="5" required placeholder="Venue equipment | 2500&#10;Refreshments | 1500">{{ values.get('budget_items','') }}</textarea></label><button>Save proposal</button></form>{% endblock %}
