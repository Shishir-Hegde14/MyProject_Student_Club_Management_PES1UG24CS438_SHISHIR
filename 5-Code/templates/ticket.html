{% extends 'base.html' %}{% block content %}<h2>Your event ticket</h2><p><strong>{{ ticket.name }}</strong></p><p>{{ ticket.event_date }} | {{ ticket.venue }}</p><p>Attendee ID: {{ ticket.attendee_id }} | {{ 'Used' if ticket.used_at else 'Not used' }}</p><img class="qr" src="{{ url_for('ticket_svg',ticket_id=ticket.id) }}" alt="QR entry ticket"><p>Keep this ticket private. It can be used once.</p><label>Ticket text for a scanner or manual check-in<textarea readonly rows="4">{{ token }}</textarea></label>{% endblock %}
